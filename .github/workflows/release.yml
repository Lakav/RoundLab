# Release pipeline.
#
# Triggered by pushing a tag of the form `v*.*.*`. The recommended way to
# create that tag is the `version-bump` workflow, which patches every
# manifest, regenerates Cargo.lock, commits, and pushes the tag in one go.
#
# Pipeline:
#   1. `checks` job: same matrix as `ci.yml` (typecheck, builds, tests,
#      clippy strict). Reuses `_checks.yml`. Release does NOT proceed if
#      any check fails.
#   2. `verify-version` job: refuses to build unless the version in
#      `tauri.conf.json` (and the matching manifests) equals the tag name.
#      This catches manual tags that skipped `version-bump`.
#   3. `build` job: matrix macOS arm64 + Windows x64. Cross-compiles parser
#      sidecars, runs tauri-action with updater signing, uploads installers
#      to the GitHub release.
#
# Optional secrets (release succeeds without them, but the in-app updater
# will reject any update that lacks a valid signature):
#   TAURI_SIGNING_PRIVATE_KEY           — contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — empty if the key has no password
#
# No Apple / Microsoft code-signing here: macOS asks for right-click → Open
# on first launch, Windows shows SmartScreen "unknown publisher". Documented
# in the README and SECURITY_RELEASE.md.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# tauri-action needs to create a release and upload assets. Declaring the
# permissions explicitly avoids relying on the repo-level default, which is
# read-only on GitHub Free unless flipped in Settings → Actions.
permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifests
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG does not look like vMAJOR.MINOR.PATCH"
            exit 1
          fi

          # Use python (always present on ubuntu runners) instead of node so
          # we don't need a setup-node step just to read three JSON values.
          PKG=$(python3 -c "import json; print(json.load(open('desktop/package.json'))['version'])")
          CONF=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          CARGO=$(grep -E '^version' desktop/src-tauri/Cargo.toml | head -1 | sed -E 's/version *= *"([^"]+)".*/\1/')

          echo "tag:                 $VERSION"
          echo "package.json:        $PKG"
          echo "tauri.conf.json:     $CONF"
          echo "Cargo.toml [package]: $CARGO"

          fail=0
          for x in "$PKG" "$CONF" "$CARGO"; do
            if [ "$x" != "$VERSION" ]; then fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::version mismatch between tag and manifests. Use the version-bump workflow to keep them aligned."
            exit 1
          fi

  build:
    needs: [checks, verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            rust-target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: "--bundles nsis"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-target }}
          workspaces: |
            desktop/src-tauri -> target
            parser-fallback -> target

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: parser/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install desktop UI dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build parser sidecars for ${{ matrix.rust-target }}
        shell: bash
        working-directory: desktop/src-tauri/binaries
        env:
          TARGET: ${{ matrix.rust-target }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: ./build-sidecar.sh

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RoundLab ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full notes.

            **macOS**: unsigned — right-click → Open on first launch.
            **Windows**: unsigned — click "More info" → "Run anyway" in SmartScreen.
          releaseDraft: false
          prerelease: false
          projectPath: desktop
          args: ${{ matrix.tauri-args }}
          updaterJsonPreferNsis: true
