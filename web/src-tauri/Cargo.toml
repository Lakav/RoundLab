[package]
name = "roundlab"
version = "0.1.0"
description = "RoundLab — CS2 demo replay workspace (desktop)"
authors = ["RoundLab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "roundlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
flate2 = "1"
thiserror = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
