name: _checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install desktop UI dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Lint desktop UI
        working-directory: desktop
        run: pnpm lint

      - name: Typecheck desktop UI
        working-directory: desktop
        run: pnpm exec tsc --noEmit

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser -> target

      - name: Validate Rust parser audit tooling
        run: |
          python3 -m py_compile \
            scripts/audit-reference-snapshots.py \
            scripts/validate-release-version.py
          python3 -m json.tool parser/reference_demos.json >/dev/null

      - name: Validate reference parser snapshots
        run: python3 scripts/audit-reference-snapshots.py --reference-only

      - name: Format Rust parser
        working-directory: parser
        run: cargo fmt --check

      - name: Test Rust parser
        working-directory: parser
        run: cargo test

      - name: Clippy Rust parser
        working-directory: parser
        run: cargo clippy --all-targets -- -D warnings

  tauri-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            parser -> target

      - name: Format Tauri commands
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Build parser sidecar for Tauri checks
        working-directory: desktop/src-tauri/binaries
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: ./build-sidecar.sh

      - name: Test Tauri commands
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Clippy Tauri commands
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
