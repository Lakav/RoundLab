# Release pipeline.
#
# Triggered by pushing a tag of the form `v*.*.*`. The recommended way to
# create that tag is the `version-bump` workflow, which patches every
# manifest, regenerates Cargo.lock, commits, and pushes the tag in one go.
#
# Pipeline:
#   1. `checks`          — invokes `_checks.yml` (same matrix as `ci.yml`).
#                          Release does not proceed if any check fails.
#   2. `verify-version`  — refuses to build unless the version in
#                          `tauri.conf.json` (and the matching manifests)
#                          equals the tag name. Catches manual tags that
#                          skipped `version-bump`.
#   3. `build`           — invokes `_build.yml` with release=true.
#                          tauri-action publishes the bundles to a
#                          GitHub Release named `RoundLab vX.Y.Z`.
#
# The build logic is shared with `ci.yml` (push to main, release=false)
# via `_build.yml` so we never duplicate the Tauri matrix.
#
# Optional secrets (release succeeds without them, but the in-app updater
# will reject any update that lacks a valid signature):
#   TAURI_SIGNING_PRIVATE_KEY           — contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — empty if the key has no password
#
# No Apple / Microsoft code-signing here: macOS asks for right-click → Open
# on first launch, Windows shows SmartScreen "unknown publisher". Documented
# in the README and SECURITY_RELEASE.md.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# `_build.yml` itself declares `contents: write`, but the called workflow
# is constrained by what the caller permits, so we declare it here too.
permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifests
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG does not look like vMAJOR.MINOR.PATCH"
            exit 1
          fi

          # Use python (always present on ubuntu runners) instead of node so
          # we don't need a setup-node step just to read three JSON values.
          PKG=$(python3 -c "import json; print(json.load(open('desktop/package.json'))['version'])")
          CONF=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          CARGO=$(grep -E '^version' desktop/src-tauri/Cargo.toml | head -1 | sed -E 's/version *= *"([^"]+)".*/\1/')

          echo "tag:                 $VERSION"
          echo "package.json:        $PKG"
          echo "tauri.conf.json:     $CONF"
          echo "Cargo.toml [package]: $CARGO"

          fail=0
          for x in "$PKG" "$CONF" "$CARGO"; do
            if [ "$x" != "$VERSION" ]; then fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::version mismatch between tag and manifests. Use the version-bump workflow to keep them aligned."
            exit 1
          fi

  build:
    needs: [checks, verify-version]
    uses: ./.github/workflows/_build.yml
    with:
      release: true
      tag-name: ${{ github.ref_name }}
    secrets: inherit
