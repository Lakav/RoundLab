# Manual version bump (minor/major or explicit version).
#
# This is the secondary release path. The PRIMARY path is `auto-release.yml`,
# which patch-bumps and releases automatically on every push to `main`.
# Use this workflow when you want a non-patch bump or a specific version.
#
# Flow:
#   1. Patch the four manifests with the requested version.
#   2. Commit and push to main (with `[skip-bump]` so auto-release doesn't
#      bump again on top).
#   3. Push the tag.
#   4. Dispatch `release.yml` to build, validate, and publish the release.
#
# Sources of truth (all must agree):
#   - desktop/package.json                ("version")
#   - desktop/src-tauri/tauri.conf.json   ("version")
#   - desktop/src-tauri/Cargo.toml        ([package] version)
#   - desktop/src-tauri/Cargo.lock        (local `roundlab` package version)
#
# Inputs:
#   - bump:    patch | minor | major (default: minor — patch is the auto
#              path's job).
#   - version: explicit version (e.g. "0.2.0"). Overrides `bump`.
#
# Guards:
#   - refuses to run off `main`
#   - refuses no-op or downgrade
#   - refuses if the tag already exists
name: version-bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (ignored if `version` is set)"
        type: choice
        default: minor
        options: [patch, minor, major]
      version:
        description: "Explicit version, e.g. 0.2.0 (overrides `bump`)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.out.outputs.tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Use the default GITHUB_TOKEN to push the bump commit and tag.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to run off main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::version-bump must be dispatched against main, got ${GITHUB_REF}"
            exit 1
          fi

      - name: Compute new version
        id: compute
        shell: bash
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, sys, pathlib

          conf = json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text())
          current = conf["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", current):
              sys.exit(f"current version is not a clean semver: {current!r}")

          explicit = os.environ.get("INPUT_VERSION", "").strip()
          bump = os.environ.get("INPUT_BUMP", "patch").strip() or "patch"

          if explicit:
              if not re.fullmatch(r"\d+\.\d+\.\d+", explicit):
                  sys.exit(f"`version` input must be MAJOR.MINOR.PATCH, got {explicit!r}")
              new = explicit
          else:
              major, minor, patch = (int(x) for x in current.split("."))
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              elif bump == "patch":
                  patch += 1
              else:
                  sys.exit(f"unknown bump: {bump!r}")
              new = f"{major}.{minor}.{patch}"

          if new == current:
              sys.exit(f"refusing no-op: new version equals current ({current})")

          # Strict-greater check (prevents accidental downgrade).
          def tup(v): return tuple(int(x) for x in v.split("."))
          if tup(new) <= tup(current):
              sys.exit(f"new version {new} must be strictly greater than current {current}")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as f:
              f.write(f"current={current}\n")
              f.write(f"new={new}\n")
          print(f"current: {current}")
          print(f"new:     {new}")
          PY

      - name: Refuse if tag already exists
        env:
          NEW: ${{ steps.compute.outputs.new }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/v${NEW}" >/dev/null; then
            echo "::error::tag v${NEW} already exists locally"
            exit 1
          fi
          # Also check remote in case someone pushed it from elsewhere.
          if git ls-remote --tags origin "v${NEW}" | grep -q "v${NEW}"; then
            echo "::error::tag v${NEW} already exists on origin"
            exit 1
          fi

      - name: Patch version in all manifests
        env:
          NEW: ${{ steps.compute.outputs.new }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, re, os
          new = os.environ["NEW"]

          for p in ["desktop/package.json", "desktop/src-tauri/tauri.conf.json"]:
              path = pathlib.Path(p)
              j = json.loads(path.read_text())
              j["version"] = new
              path.write_text(json.dumps(j, indent=2) + "\n")

          cargo = pathlib.Path("desktop/src-tauri/Cargo.toml")
          s = cargo.read_text()
          # Replace the first `version = "..."` that follows [package].
          s_new, n = re.subn(
              r'(\[package\][^\[]*?\nversion\s*=\s*)"[^"]+"',
              lambda m: f'{m.group(1)}"{new}"',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit("could not patch [package] version in Cargo.toml")
          cargo.write_text(s_new)

          lock = pathlib.Path("desktop/src-tauri/Cargo.lock")
          text = lock.read_text()
          block_re = re.compile(r'(\[\[package\]\]\nname = "roundlab"\nversion = )"[^"]+"')
          text_new, n = block_re.subn(lambda m: f'{m.group(1)}"{new}"', text, count=1)
          if n != 1:
              raise SystemExit("could not patch roundlab version in Cargo.lock")
          lock.write_text(text_new)
          PY
          echo "--- after patch ---"
          grep '"version"' desktop/package.json
          grep '"version"' desktop/src-tauri/tauri.conf.json
          grep -E '^version' desktop/src-tauri/Cargo.toml

      - name: Commit, tag, push
        env:
          NEW: ${{ steps.compute.outputs.new }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            desktop/package.json \
            desktop/src-tauri/tauri.conf.json \
            desktop/src-tauri/Cargo.toml \
            desktop/src-tauri/Cargo.lock

          git commit -m "chore: bump version to v${NEW} [skip-bump]"
          git tag -a "v${NEW}" -m "RoundLab v${NEW}"
          git push origin main
          git push origin "v${NEW}"

      - name: Expose tag for the release job
        id: out
        env:
          NEW: ${{ steps.compute.outputs.new }}
        run: echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"

  dispatch-release:
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.bump.outputs.tag }}
        run: gh workflow run release.yml -R "${{ github.repository }}" --ref main -f tag-name="$TAG_NAME"
