# Release pipeline — FALLBACK PATH.
#
# The PRIMARY release path is `auto-release.yml` (push to main) and the
# secondary one is `version-bump.yml` (manual minor/major bumps). Both
# call `_build.yml` directly because tags pushed by Actions using
# GITHUB_TOKEN do NOT trigger other workflows (GitHub's loop-prevention
# rule).
#
# This workflow is left in place for two cases only:
#   - someone pushed a `v*.*.*` tag from their local machine (using their
#     own credentials, which DO trigger workflows);
#   - someone wants to redo a release on an existing tag via
#     `workflow_dispatch` from the Actions UI.
#
# Pipeline:
#   1. `checks`         — invokes `_checks.yml`.
#   2. `verify-version` — refuses to build unless every manifest matches
#                          the tag.
#   3. `build`          — invokes `_build.yml` with release=true.
#
# Optional secrets:
#   TAURI_SIGNING_PRIVATE_KEY           — contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — empty if the key has no password
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag-name:
        description: "Existing release tag to rebuild, e.g. v0.1.27. Defaults to the selected ref."
        type: string
        required: false
        default: ""

# `_build.yml` itself declares `contents: write`, but the called workflow
# is constrained by what the caller permits, so we declare it here too.
permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag-name || github.ref_name }}

      - name: Tag must match manifests
        shell: bash
        run: python3 scripts/validate-release-version.py --tag "${{ inputs.tag-name || github.ref_name }}"

  build:
    needs: [checks, verify-version]
    uses: ./.github/workflows/_build.yml
    with:
      release: true
      tag-name: ${{ inputs.tag-name || github.ref_name }}
    secrets: inherit
