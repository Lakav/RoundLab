allowBuilds:
  # MSW is a transitive test dependency; RoundLab does not use its postinstall.
  msw: false
  # Next image optimization is disabled for the static export, so Sharp's
  # native install script is unnecessary.
  sharp: false
  # ESLint's resolver uses this postinstall only to select and verify the
  # platform-specific native binding already pinned in pnpm-lock.yaml.
  unrs-resolver: true
ignoredOptionalDependencies:
  # RoundLab exports static HTML with `images.unoptimized`; the server-side
  # image optimizer is not shipped or executed. Excluding Sharp avoids
  # installing an unused optional native dependency with known advisories.
  - sharp
minimumReleaseAgeExclude:
  - '@next/env@16.2.11'
  - '@next/eslint-plugin-next@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - eslint-config-next@16.2.11
  - next@16.2.11
  - '@hono/node-server@2.0.5'
  - postcss@8.5.12 || 8.5.18
  - minimatch@10.2.5
overrides:
  # Patched release pulled transitively by Hono.
  '@hono/node-server@<2.0.5': ^2.0.5
  # Replace the legacy minimatch branch that requires vulnerable brace-expansion.
  minimatch@<=3.1.5: ^10.2.5
  # Patched PostCSS releases for GHSA-6g55-p6wh-862q and GHSA-r28c-9q8g-f849.
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
