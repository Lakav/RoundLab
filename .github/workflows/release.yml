# Release pipeline — FALLBACK PATH.
#
# The PRIMARY release path is `auto-release.yml` (push to main) and the
# secondary one is `version-bump.yml` (manual minor/major bumps). Both
# call `_build.yml` directly because tags pushed by Actions using
# GITHUB_TOKEN do NOT trigger other workflows (GitHub's loop-prevention
# rule).
#
# This workflow is left in place for two cases only:
#   - someone pushed a `v*.*.*` tag from their local machine (using their
#     own credentials, which DO trigger workflows);
#   - someone wants to redo a release on an existing tag via
#     `workflow_dispatch` from the Actions UI.
#
# Pipeline:
#   1. `checks`         — invokes `_checks.yml`.
#   2. `verify-version` — refuses to build unless every manifest matches
#                          the tag.
#   3. `build`          — invokes `_build.yml` with release=true.
#
# Optional secrets:
#   TAURI_SIGNING_PRIVATE_KEY           — contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — empty if the key has no password
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# `_build.yml` itself declares `contents: write`, but the called workflow
# is constrained by what the caller permits, so we declare it here too.
permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifests
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG does not look like vMAJOR.MINOR.PATCH"
            exit 1
          fi

          # Use python (always present on ubuntu runners) instead of node so
          # we don't need a setup-node step just to read three JSON values.
          PKG=$(python3 -c "import json; print(json.load(open('desktop/package.json'))['version'])")
          CONF=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          CARGO=$(grep -E '^version' desktop/src-tauri/Cargo.toml | head -1 | sed -E 's/version *= *"([^"]+)".*/\1/')

          echo "tag:                 $VERSION"
          echo "package.json:        $PKG"
          echo "tauri.conf.json:     $CONF"
          echo "Cargo.toml [package]: $CARGO"

          fail=0
          for x in "$PKG" "$CONF" "$CARGO"; do
            if [ "$x" != "$VERSION" ]; then fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::version mismatch between tag and manifests. Use the version-bump workflow to keep them aligned."
            exit 1
          fi

  build:
    needs: [checks, verify-version]
    uses: ./.github/workflows/_build.yml
    with:
      release: true
      tag-name: ${{ github.ref_name }}
    secrets: inherit
