# Continuous integration for pull requests.
#
# Runs the check matrix on every PR targeting `main`. PRs cannot be
# merged while this is red (configure branch protection in repo settings).
#
# This workflow does NOT build installers or create releases. The release
# pipeline lives in `auto-release.yml` and runs on push to `main`.
name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml
