name: _checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install web app dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Lint web app
        working-directory: desktop
        run: pnpm lint

      - name: Typecheck web app
        working-directory: desktop
        run: pnpm exec tsc --noEmit

      - name: Build web app
        working-directory: desktop
        run: pnpm build

      - name: Validate static export output
        run: python3 scripts/audit-static-export-output.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser -> target

      - name: Validate Rust parser audit tooling
        run: |
          python3 -m py_compile \
            scripts/audit-browser-import-flow.py \
            scripts/audit-browser-import-workflow.py \
            scripts/audit-browser-parser-locality.py \
            scripts/audit-browser-store-contract.py \
            scripts/audit-ci-coverage.py \
            scripts/audit-home-accessibility.py \
            scripts/audit-match-controls.py \
            scripts/audit-match-layout.py \
            scripts/audit-parse-estimate.py \
            scripts/audit-parser-fidelity.py \
            scripts/audit-public-assets.py \
            scripts/audit-reference-snapshots.py \
            scripts/audit-replay-fixture-coverage.py \
            scripts/audit-replay-renderer-contract.py \
            scripts/audit-replay-rendering.py \
            scripts/audit-static-web-export.py \
            scripts/audit-static-export-output.py \
            scripts/audit-web-portability.py \
            scripts/validate-release-version.py
          python3 -m json.tool docs/replay-fixture-coverage.json >/dev/null
          python3 -m json.tool parser/reference_demos.json >/dev/null

      - name: Validate web portability
        run: python3 scripts/audit-web-portability.py

      - name: Validate static web export
        run: python3 scripts/audit-static-web-export.py

      - name: Validate CI audit coverage
        run: python3 scripts/audit-ci-coverage.py

      - name: Validate browser parser locality
        run: python3 scripts/audit-browser-parser-locality.py

      - name: Validate browser import flow
        run: python3 scripts/audit-browser-import-flow.py

      - name: Validate browser import workflow
        run: python3 scripts/audit-browser-import-workflow.py

      - name: Validate browser store contract
        run: python3 scripts/audit-browser-store-contract.py

      - name: Validate home accessibility contract
        run: python3 scripts/audit-home-accessibility.py

      - name: Validate match review controls
        run: python3 scripts/audit-match-controls.py

      - name: Validate match layout sizing
        run: python3 scripts/audit-match-layout.py

      - name: Validate parse time estimate
        run: python3 scripts/audit-parse-estimate.py

      - name: Validate parser fidelity defaults
        run: python3 scripts/audit-parser-fidelity.py

      - name: Validate public assets
        run: python3 scripts/audit-public-assets.py

      - name: Validate reference parser snapshots
        run: python3 scripts/audit-reference-snapshots.py --reference-only

      - name: Validate replay fixture coverage manifest
        run: python3 scripts/audit-replay-fixture-coverage.py

      - name: Validate replay renderer contract
        run: python3 scripts/audit-replay-renderer-contract.py

      - name: Validate replay map assets
        run: python3 scripts/audit-replay-rendering.py --assets-only

      - name: Format Rust parser
        working-directory: parser
        run: cargo fmt --check

      - name: Test Rust parser
        working-directory: parser
        run: cargo test

      - name: Check browser WASM parser build
        working-directory: parser
        run: cargo check --target wasm32-unknown-unknown --lib

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Verify committed browser WASM artifacts
        run: |
          cd parser
          cargo build --target wasm32-unknown-unknown --release --lib
          wasm-bindgen target/wasm32-unknown-unknown/release/roundlab_parser.wasm \
            --target web \
            --out-dir ../desktop/src/wasm/roundlab_parser \
            --out-name roundlab_parser
          cd ..
          git diff --exit-code -- desktop/src/wasm/roundlab_parser

      - name: Clippy Rust parser
        working-directory: parser
        run: cargo clippy --all-targets -- -D warnings
