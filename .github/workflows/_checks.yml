name: _checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install web app dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Audit web dependencies
        working-directory: desktop
        run: pnpm audit --audit-level high

      - name: Lint web app
        working-directory: desktop
        run: pnpm lint

      - name: Typecheck web app
        working-directory: desktop
        run: pnpm exec tsc --noEmit

      - name: Test web app with coverage thresholds
        working-directory: desktop
        run: pnpm test:coverage

      - name: Build web app
        working-directory: desktop
        run: pnpm build

      - name: Enforce production asset budgets
        run: python3 scripts/check-performance-budgets.py

      - name: Run browser accessibility checks
        working-directory: desktop
        run: pnpm test:e2e:a11y

      - name: Validate static export output
        run: python3 scripts/audit-static-export-output.py

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: desktop/coverage
          if-no-files-found: error

      - name: Upload browser accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-accessibility-report
          path: desktop/playwright-report
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser -> target

      - name: Validate Rust parser audit tooling
        run: |
          python3 -m py_compile \
            scripts/audit-browser-parser-locality.py \
            scripts/audit-public-assets.py \
            scripts/audit-reference-snapshots.py \
            scripts/audit-replay-fixture-coverage.py \
            scripts/audit-replay-rendering.py \
            scripts/audit-security-baseline.py \
            scripts/audit-static-web-export.py \
            scripts/audit-static-export-output.py \
            scripts/audit-web-portability.py \
            scripts/benchmark-native-parser.py \
            scripts/check-performance-budgets.py \
            scripts/run-local-ci-checks.py \
            scripts/summarize-browser-benchmark.py \
            scripts/verify-wasm-reproducibility.py \
            scripts/validate-release-version.py
          python3 -m json.tool docs/replay-fixture-coverage.json >/dev/null
          python3 -m json.tool parser/reference_demos.json >/dev/null

      - name: Validate web portability
        run: python3 scripts/audit-web-portability.py

      - name: Validate static web export
        run: python3 scripts/audit-static-web-export.py

      - name: Validate browser parser locality
        run: python3 scripts/audit-browser-parser-locality.py

      - name: Validate public assets
        run: python3 scripts/audit-public-assets.py

      - name: Validate reference parser snapshots
        run: python3 scripts/audit-reference-snapshots.py --reference-only

      - name: Validate replay fixture coverage manifest
        run: python3 scripts/audit-replay-fixture-coverage.py

      - name: Validate replay map assets
        run: python3 scripts/audit-replay-rendering.py --assets-only

      - name: Validate security baseline
        run: python3 scripts/audit-security-baseline.py

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Audit Rust dependencies
        working-directory: parser
        run: cargo audit

      - name: Format Rust parser
        working-directory: parser
        run: cargo fmt --check

      - name: Test Rust parser
        working-directory: parser
        run: cargo test

      - name: Measure Rust coverage
        working-directory: parser
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --json \
            --output-path coverage/coverage-summary.json

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-portable
          path: parser/coverage/coverage-summary.json
          if-no-files-found: error

      - name: Check browser WASM parser build
        working-directory: parser
        run: cargo check --target wasm32-unknown-unknown --lib

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Verify committed browser WASM artifacts
        run: python3 scripts/verify-wasm-reproducibility.py --check-git

      - name: Upload Linux browser WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: browser-wasm-linux
          path: desktop/src/wasm/roundlab_parser
          if-no-files-found: error

      - name: Clippy Rust parser
        working-directory: parser
        run: cargo clippy --all-targets -- -D warnings
