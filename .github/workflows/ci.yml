# Continuous integration.
#
# - On every PR targeting `main`: run the check matrix only (fast,
#   cheap, blocks merge if red).
# - On every push to `main`: run the check matrix AND build macOS+Windows
#   bundles. The bundles are published as workflow artifacts on the run
#   page (NOT as a GitHub Release). This gives anyone a downloadable
#   build of `main` after every push without polluting the release
#   channel.
#
# A real GitHub Release is only created by `release.yml` (triggered by
# pushing a `v*.*.*` tag, normally via the `version-bump` workflow).
#
# All actual logic lives in reusable workflows:
#   - `_checks.yml`  — typecheck, build, tests, clippy strict
#   - `_build.yml`   — Tauri bundle matrix (macOS arm64 + Windows x64)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  build:
    # Only build on push to `main`. PRs stop at `checks`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    uses: ./.github/workflows/_build.yml
    with:
      release: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
