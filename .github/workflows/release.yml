# Release pipeline.
#
# Pipeline:
#   1. `verify-version`          — source manifests must match the tag.
#   2. `build`                   — invokes `_build.yml` with release=true.
#   3. `validate-release-assets` — downloaded GitHub Release assets and
#                                  latest.json must match the tag.
#
# Optional secrets:
#   TAURI_SIGNING_PRIVATE_KEY           — contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — empty if the key has no password
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag-name:
        description: "Existing release tag to rebuild, e.g. v0.1.27. Defaults to the selected ref."
        type: string
        required: false
        default: ""

# `_build.yml` itself declares `contents: write`, but the called workflow
# is constrained by what the caller permits, so we declare it here too.
permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag-name || github.ref_name }}

      - name: Source versions must match tag
        shell: bash
        run: python3 scripts/validate-release-version.py --mode pre-build --tag "${{ inputs.tag-name || github.ref_name }}"

  build:
    needs: verify-version
    uses: ./.github/workflows/_build.yml
    with:
      release: true
      tag-name: ${{ inputs.tag-name || github.ref_name }}
    secrets: inherit

  validate-release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ inputs.tag-name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release metadata
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG_NAME" --pattern latest.json --dir "$RUNNER_TEMP/release"

      - name: Generated assets must match tag
        shell: bash
        run: |
          python3 scripts/validate-release-version.py \
            --mode post-build \
            --tag "$TAG_NAME" \
            --assets-list "$RUNNER_TEMP/release-assets.txt" \
            --latest-json "$RUNNER_TEMP/release/latest.json"
