name: _checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install desktop UI dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Lint desktop UI
        working-directory: desktop
        run: pnpm lint

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: parser/go.sum

      - name: Test parser
        working-directory: parser
        run: go test ./...

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            parser-fallback -> target

      - name: Install cargo check system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Stub sidecar binaries for cargo check
        working-directory: desktop/src-tauri/binaries
        run: |
          mkdir -p .
          touch parser-x86_64-unknown-linux-gnu parser-fallback-x86_64-unknown-linux-gnu
          chmod +x parser-x86_64-unknown-linux-gnu parser-fallback-x86_64-unknown-linux-gnu

      - name: Check desktop shell
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Check parser fallback
        working-directory: parser-fallback
        run: cargo check
