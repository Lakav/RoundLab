# =============================================================================
# TRIAGE-ONLY WINDOWS BUILD — NOT a release pipeline.
# =============================================================================
#
# Use this when you need an installable .exe on a Windows machine for QA
# or log collection (e.g. the 95-99% finalization wedge triage), and you
# want it built off a specific commit/branch without going through `main`.
#
# In practice, this is a thin wrapper around `_build.yml`. Use it only when
# you need a Windows installer without creating a GitHub Release.
#
# Outputs:
#   - artifact `roundlab-windows-x64`  — installer .exe (+ .sig if updater
#                                        secrets are configured)
#
# This workflow does NOT create a GitHub Release. For releases, use
# `auto-release`, `version-bump`, or `release.yml`.
name: triage-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      release: false
      only-windows: true
    secrets: inherit
