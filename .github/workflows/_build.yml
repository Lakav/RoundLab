# Reusable build workflow.
#
# Builds the Tauri app for macOS arm64 and Windows x64 in a matrix. Used by:
#   - `ci.yml`        on push to main, with release=false → bundles are
#                     uploaded as workflow artifacts (no GitHub Release).
#   - `release.yml`   on a v*.*.* tag, with release=true → tauri-action
#                     publishes the bundles to a GitHub Release.
#   - `triage-windows.yml`  on workflow_dispatch, restricted to Windows
#                     for one-off QA installers.
#
# Inputs:
#   release           — when true, tauri-action creates/updates a GitHub
#                       Release named `RoundLab <tagName>` and uploads the
#                       bundles to it. When false, no Release is touched
#                       and the bundles end up in workflow artifacts.
#   tag-name          — required when release=true. The git tag that names
#                       the release (e.g. `v0.2.0`). Ignored when release=false.
#   only-windows      — when true, drop macOS from the matrix. Used by
#                       `triage-windows.yml` to avoid wasting macOS minutes
#                       for Windows-only investigations.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY            — optional. Without it, no `.sig`
#                                          is produced and the in-app
#                                          updater rejects updates.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   — optional. Required iff the key
#                                          is password-protected.
name: _build

on:
  workflow_call:
    inputs:
      release:
        description: "Publish bundles to a GitHub Release"
        type: boolean
        required: false
        default: false
      tag-name:
        description: "Git tag for the release (required when release=true)"
        type: string
        required: false
        default: ""
      only-windows:
        description: "Skip the macOS leg of the matrix"
        type: boolean
        required: false
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  # `contents: write` is needed by tauri-action when release=true to create
  # the Release and upload assets. It is harmless when release=false.
  contents: write

jobs:
  matrix:
    # Compute the matrix once on a tiny ubuntu runner so the heavy build
    # legs only spin up the targets we actually need. Also validates the
    # release/tag-name pairing here, before any expensive runner is booted.
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - name: Validate inputs
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          if [ "${RELEASE}" = "true" ] && [ -z "${TAG_NAME}" ]; then
            echo "::error::release=true requires tag-name to be set"
            exit 1
          fi

      - id: set
        shell: bash
        env:
          ONLY_WINDOWS: ${{ inputs.only-windows }}
        run: |
          set -euo pipefail
          if [ "${ONLY_WINDOWS}" = "true" ]; then
            INCLUDE='[{"name":"windows-x64","os":"windows-latest","rust-target":"x86_64-pc-windows-msvc","tauri-args":"--bundles nsis","artifact-glob":"desktop/src-tauri/target/release/bundle/nsis/*"}]'
          else
            INCLUDE='[
              {"name":"macos-arm64","os":"macos-14","rust-target":"aarch64-apple-darwin","tauri-args":"--target aarch64-apple-darwin","artifact-glob":"desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*"},
              {"name":"windows-x64","os":"windows-latest","rust-target":"x86_64-pc-windows-msvc","tauri-args":"--bundles nsis","artifact-glob":"desktop/src-tauri/target/release/bundle/nsis/*"}
            ]'
          fi
          # actions/runner expects the matrix include as a JSON string on a
          # single line; squash whitespace.
          echo "include=$(echo "$INCLUDE" | tr -d '\n' | sed 's/  */ /g')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-target }}
          workspaces: |
            desktop/src-tauri -> target
            parser-fallback -> target

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: parser/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install desktop UI dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build parser sidecars for ${{ matrix.rust-target }}
        shell: bash
        working-directory: desktop/src-tauri/binaries
        env:
          TARGET: ${{ matrix.rust-target }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: ./build-sidecar.sh

      # ---------------------------------------------------------------
      # Two mutually-exclusive build steps: tauri-action takes a different
      # set of inputs depending on whether we are publishing a release.
      # ---------------------------------------------------------------

      - name: Build (no release) — tauri-action
        if: ${{ !inputs.release }}
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing is optional. When secrets are missing,
          # tauri-action skips signing silently.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.tauri-args }}

      - name: Build + publish release — tauri-action
        if: ${{ inputs.release }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.tauri-args }}
          tagName: ${{ inputs.tag-name }}
          releaseName: "RoundLab ${{ inputs.tag-name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full notes.

            **macOS**: unsigned — right-click → Open on first launch.
            **Windows**: unsigned — click "More info" → "Run anyway" in SmartScreen.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      # ---------------------------------------------------------------
      # When release=false, the bundles are still on disk; expose them
      # as workflow artifacts so they can be downloaded from the run page.
      # When release=true, tauri-action already attached them to the
      # Release and we skip this step to avoid duplicating storage.
      # ---------------------------------------------------------------

      - name: Upload bundle artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: roundlab-${{ matrix.name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 30
